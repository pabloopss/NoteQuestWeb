<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Partidas - Vôlei do Tio Budog</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #2c3e50; color: white; text-align: center; }
        h1 { color: #f1c40f; margin-bottom: 5px; }
        .subtitulo { color: #bdc3c7; font-size: 16px; margin-bottom: 30px; }
        
        .historico-container { display: flex; flex-direction: column; align-items: center; gap: 15px; max-width: 800px; margin: 0 auto; }
        
        .partida-card { background: #34495e; padding: 15px; border-radius: 10px; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-left: 5px solid #3498db; }
        .partida-card.vencedor-a { border-left-color: #2ecc71; }
        .partida-card.vencedor-b { border-left-color: #e74c3c; }
        
        .data-hora { font-size: 12px; color: #95a5a6; text-align: left; margin-bottom: 10px; border-bottom: 1px solid #7f8c8d; padding-bottom: 5px; }
        
        .placar-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        
        .time-hist { flex: 1; }
        .time-hist h3 { margin: 0; color: #ecf0f1; font-size: 18px; }
        .pontos-hist { font-size: 40px; font-weight: bold; }
        
        /* Destaque para o vencedor */
        .ganhou { color: #f1c40f; } 
        .perdeu { color: #7f8c8d; }
        
        .x-divisor { font-size: 20px; font-weight: bold; color: #7f8c8d; margin: 0 15px; }
        
        .lista-jogadores-hist { font-size: 14px; color: #bdc3c7; line-height: 1.4; text-align: left; background: #2c3e50; padding: 10px; border-radius: 5px; margin-top: 5px; min-height: 100px; }
        
        .jogadores-container { display: flex; gap: 15px; }
        
        .msg-vazio { color: #7f8c8d; font-style: italic; margin-top: 50px; }
        
    </style>
</head>
<body>

    <h1>📋 Histórico de Partidas</h1>
    <div class="subtitulo">Registro dos jogos finalizados hoje</div>

    <div id="historicoContainer" class="historico-container">
        <p class="msg-vazio">Carregando histórico...</p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAVNJpud6rhUHEWZxBSJ-o-8WcMtexk6yw",
            authDomain: "notequestweb.firebaseapp.com",
            projectId: "notequestweb",
            storageBucket: "notequestweb.firebasestorage.app",
            messagingSenderId: "1062376453055",
            appId: "1:1062376453055:web:f06d234ff7b194dcf4670a"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Ouve a coleção "historico", ordenando da mais recente para a mais antiga
        db.collection('historico').orderBy('timestamp', 'desc').onSnapshot((snapshot) => {
            const container = document.getElementById('historicoContainer');
            
            if (snapshot.empty) {
                container.innerHTML = "<p class='msg-vazio'>Nenhuma partida registrada ainda.</p>";
                return;
            }

            let html = "";

            snapshot.forEach((doc) => {
                const dados = doc.data();
                
                // Formatação da Data e Hora
                let dataFormatada = "Data não registrada";
                if (dados.timestamp) {
                    const dataObj = dados.timestamp.toDate();
                    dataFormatada = dataObj.toLocaleDateString('pt-BR') + ' às ' + dataObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                }

                // Definindo cores dependendo do vencedor
                const aGanhou = dados.vencedor === "Time A";
                const bGanhou = dados.vencedor === "Time B";
                
                const classeCard = aGanhou ? "vencedor-a" : (bGanhou ? "vencedor-b" : "");
                const corPontosA = aGanhou ? "ganhou" : "perdeu";
                const corPontosB = bGanhou ? "ganhou" : "perdeu";
                const corIconeA = aGanhou ? "🏆" : "";
                const corIconeB = bGanhou ? "🏆" : "";

                // Formatar lista de nomes (verificando se existe pra não dar erro)
                const listaA = (dados.timeA || []).map(nome => `• ${nome}`).join('<br>') || "Sem registro";
                const listaB = (dados.timeB || []).map(nome => `• ${nome}`).join('<br>') || "Sem registro";

                // Montar o Card da partida
                html += `
                    <div class="partida-card ${classeCard}">
                        <div class="data-hora">🕒 ${dataFormatada}</div>
                        
                        <div class="placar-box">
                            <div class="time-hist" style="text-align: right;">
                                <h3>Time A ${corIconeA}</h3>
                                <div class="pontos-hist ${corPontosA}">${dados.pontosA}</div>
                            </div>
                            
                            <div class="x-divisor">X</div>
                            
                            <div class="time-hist" style="text-align: left;">
                                <h3>${corIconeB} Time B</h3>
                                <div class="pontos-hist ${corPontosB}">${dados.pontosB}</div>
                            </div>
                        </div>

                        <div class="jogadores-container">
                            <div class="time-hist">
                                <div class="lista-jogadores-hist">${listaA}</div>
                            </div>
                            <div class="time-hist">
                                <div class="lista-jogadores-hist">${listaB}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

        }, (error) => {
            document.getElementById('historicoContainer').innerHTML = `<p class='msg-vazio' style="color: #e74c3c;">Erro ao carregar histórico: ${error.message}</p>`;
        });
    </script>
</body>
</html>
